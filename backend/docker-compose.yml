services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: psihorar
      POSTGRES_PASSWORD: psihorar
      POSTGRES_DB: psihorar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psihorar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://psihorar:psihorar@db:5432/psihorar
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
